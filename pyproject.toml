[project]
name = "quantic"
version = "0.1.0"
description = "Quantum vs classical benchmark platform for combinatorial liquidation and L-VaR"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "polars>=1.0",
    "pyarrow>=16.0",
    "scikit-learn>=1.4",
    "typer>=0.12",
    "rich>=13.0",
    # Windows ships no system IANA tz database; core.session needs one.
    "tzdata>=2024.1",
    "ortools>=9.15.6755",
    "dwave-samplers>=1.8.0",
    "dimod>=0.12.22",
    "duckdb>=1.5.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "import-linter>=2.0",
]

[project.scripts]
quantic = "quantic.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.importlinter]
root_package = "quantic"

[[tool.importlinter.contracts]]
name = "Layered architecture (spec section 12)"
type = "layers"
layers = [
    "quantic.dashboard",
    "quantic.viz",
    "quantic.bench",
    "quantic.solvers",
    "quantic.encoding",
    "quantic.problem",
    "quantic.micro",
    "quantic.data",
    "quantic.core",
]
exhaustive = false

[[tool.importlinter.contracts]]
name = "Solvers read the problem and never build it (spec section 12)"
type = "forbidden"
source_modules = ["quantic.solvers"]
forbidden_modules = [
    "quantic.problem.generator",
    "quantic.problem.from_bundle",
    "quantic.problem.liquidation",
]

[[tool.importlinter.contracts]]
name = "The exact baseline does not read the encoder (M3b design section 6)"
type = "forbidden"
source_modules = [
    "quantic.solvers.base",
    "quantic.solvers.classical.lot_grid",
    "quantic.solvers.classical.scoring",
    "quantic.solvers.classical.brute_force",
    "quantic.solvers.classical.milp_model",
    "quantic.solvers.classical.exact_pwl_milp",
    "quantic.solvers.classical.cpsat",
    "quantic.solvers.classical.almgren_chriss",
]
forbidden_modules = ["quantic.encoding"]

[[tool.importlinter.contracts]]
name = "The three exact methods are independent (M4 design section 8)"
type = "independence"
modules = [
    "quantic.solvers.classical.brute_force",
    "quantic.solvers.classical.exact_pwl_milp",
    "quantic.solvers.classical.cpsat",
]
