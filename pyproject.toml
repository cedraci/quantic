[project]
name = "quantic"
version = "0.1.0"
description = "Quantum vs classical benchmark platform for combinatorial liquidation and L-VaR"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "polars>=1.0",
    "pyarrow>=16.0",
    "scikit-learn>=1.4",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "import-linter>=2.0",
]

[project.scripts]
quantic = "quantic.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.importlinter]
root_package = "quantic"

[[tool.importlinter.contracts]]
name = "Layered architecture (spec section 12)"
type = "layers"
layers = [
    "quantic.dashboard",
    "quantic.viz",
    "quantic.bench",
    "quantic.solvers",
    "quantic.encoding",
    "quantic.problem",
    "quantic.micro",
    "quantic.data",
    "quantic.core",
]
exhaustive = false
